<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padel Toernooi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="img/boor-logo.png" alt="BOOR – kwaliteit in onderwijs"><span class="brand-title" id="brandName">Padel Toernooi</span></div>
    <nav class="tabs">
      <button data-tab="config">Configuratie</button>
      <button data-tab="results">Schema</button>
      <button data-tab="standings">Tussenstand</button>
    </nav>
    <div class="cloud" id="cloudBar"></div>
    <div class="top-actions">
      <div class="export-wrap">
        <button class="btn ghost small" id="btnExport" aria-haspopup="true">Exporteer ▾</button>
        <div class="export-menu" id="exportMenu" hidden>
          <button data-export="pdf">📄 Eindstand als PDF</button>
          <button data-export="json">💾 Toernooibestand (JSON)</button>
        </div>
      </div>
      <button class="btn ghost small" id="btnImport" title="Toernooi laden uit bestand">Importeer</button>
      <button class="btn ghost small danger" id="btnReset" title="Alles wissen">Reset</button>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
    </div>
  </header>

  <main>
    <section id="tab-config" class="tab"></section>
    <section id="tab-results" class="tab"></section>
    <section id="tab-standings" class="tab"></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/cloud.js?v=14"></script>
  <script src="js/importer.js?v=14"></script>
  <script src="js/scheduler.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
